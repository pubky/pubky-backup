[package]
name = "pubky-backup-core"
version = "0.5.0"
edition = "2021"

[dependencies]
pubky = { git = "https://github.com/pubky/pubky-homeserver", tag = "v0.7.0" }
opendal = { version = "0.54.0", features = ["services-fs"] }
log = "0.4.28"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
futures-lite = "2.6.1"
futures-util = "0.3"
thiserror = "2.0.16"
url = "2.5.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
parking_lot = "0.12"
rand = "0.8"

[dev-dependencies]
tempfile = "3.14"
pubky-testnet = { git = "https://github.com/pubky/pubky-homeserver", tag = "v0.7.0", features = ["embedded-postgres"] }
serial_test = "3"

