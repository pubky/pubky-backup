[package]
name = "pubky-backup-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pubky = { git = "https://github.com/pubky/pubky-core", rev = "a97b30d5fa8c12483358ae283adda8f7d01ec774" }
opendal = { version = "0.54.0", features = ["services-fs"] }
log = "0.4.28"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
futures-lite = "2.6.1"
futures-util = "0.3"
thiserror = "2.0.16"
url = "2.5.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.14"
pubky-testnet = { git = "https://github.com/pubky/pubky-core", rev = "a97b30d5fa8c12483358ae283adda8f7d01ec774", features = ["embedded-postgres"] }

