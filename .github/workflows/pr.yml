name: PR actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  # Enable manual trigger
  workflow_dispatch:


jobs:
  rust-build:
    name: Build Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        id: setup
        uses: ./.github/setup
      - name: Build Project
        run: cd src-tauri && cargo build --verbose

  formatting-and-tests:
    name: Check formatting and run tests
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        id: setup
        uses: ./.github/setup

      - name: Run Rustfmt (Code Formatting)
        run: cd src-tauri && cargo fmt --all -- --check

      - name: Run Clippy (Lint)
        run: cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cd src-tauri && cargo test --verbose

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
  
      - name: Install Node dependencies
        run: npm ci
  
      - name: Check formatting
        run: npm run format:check

      - name: Check typing
        run: npm run type-check


