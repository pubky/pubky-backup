name: PR actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  # Enable manual trigger
  workflow_dispatch:


jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check typing
        run: npm run type-check
      - name: Run frontend tests
        run: npm run test:run

  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/setup
        
      - name: Run Rustfmt (Code Formatting)
        run: cd src-tauri && cargo fmt --all -- --check

      - name: Run Clippy (Lint)
        run: cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Project
        run: cd src-tauri && cargo build --verbose --tests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-build
          path: src-tauri/target
          retention-days: 1

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-build
          path: src-tauri/target

      - name: Run Rust unit tests
        run: cd src-tauri && cargo test --verbose --workspace --exclude pubky-backup-core

      - name: Run pubky-backup-core unit tests
        run: cd src-tauri && cargo test -p pubky-backup-core --lib --verbose

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-build
          path: src-tauri/target

      - name: Cache PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/pubky-testnet/postgresql
          key: postgres-embedded-${{ runner.os }}

      - name: Run integration tests
        run: cd src-tauri && cargo test -p pubky-backup-core --test integration_tests --verbose -- --test-threads=1
