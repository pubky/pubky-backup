name: PR actions

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  # Enable manual trigger
  workflow_dispatch:


jobs:
  rust-build:
    name: Build Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        id: setup
        uses: ./.github/setup
      - name: Build Project
        run: cd src-tauri && cargo build --verbose

  rust-format:
    name: Check Rust Format
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        id: setup
        uses: ./.github/setup
      - name: Run Rustfmt (Code Formatting)
        run: cd src-tauri && cargo fmt --all -- --check

  rust-clippy:
    name: Check Clippy
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        id: setup
        uses: ./.github/setup

      - name: Run Clippy (Lint)
        run: cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Test Rust
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        id: setup
        uses: ./.github/setup
      - name: Run Tests
        run: cd src-tauri && cargo test --verbose

  js-format:
    name: Check JS Code Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check
