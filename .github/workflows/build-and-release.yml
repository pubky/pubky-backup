name: 'Build and Release'

on:
  push:
    tags:
      - 'v*'

# Builds the app for every platform on a version tag and publishes a release
# with the artifacts. See RELEASING.md.
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate semver format
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SEMVER_REGEX="^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?(\+([0-9A-Za-z.-]+))?$"
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not valid semver (expected e.g. v0.6.0, v1.0.0-rc.1)"
            exit 1
          fi

      - name: Verify versions match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MISMATCH=0
          for MANIFEST in src-tauri/Cargo.toml src-tauri/pubky-backup-core/Cargo.toml; do
            FOUND=$(grep -m1 '^version' "$MANIFEST" | cut -d'"' -f2)
            if [ "$FOUND" != "$VERSION" ]; then
              echo "::error::Version mismatch in $MANIFEST: tag is $VERSION but it has $FOUND"
              MISMATCH=1
            fi
          done
          FOUND=$(node -p "require('./package.json').version")
          if [ "$FOUND" != "$VERSION" ]; then
            echo "::error::Version mismatch in package.json: tag is $VERSION but it has $FOUND"
            MISMATCH=1
          fi
          if [ "$MISMATCH" = 1 ]; then
            echo "Run ./.scripts/set-version.sh $VERSION and merge it before tagging"
            exit 1
          fi
          echo "All versions match tag: $VERSION"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          # TODO: arm64 runners will become available once the repo is made public
          # - platform: 'ubuntu-22.04-arm64'
          #   args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ (matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin') || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Use the git tag as-is (e.g., v0.1.0)
            VERSION="${{ github.ref_name }}"
          else
            # Fallback to Cargo.toml for non-tag builds (add 'v' prefix)
            VERSION="v$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and bundle Tauri App
        uses: tauri-apps/tauri-action@v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Rename Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          cp src-tauri/target/release/bundle/appimage/*.AppImage pubky-backup-${{ steps.version.outputs.version }}-linux-amd64.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb pubky-backup-${{ steps.version.outputs.version }}-linux-amd64.deb

      - name: Rename Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: cp src-tauri/target/release/bundle/msi/*.msi pubky-backup-${{ steps.version.outputs.version }}-windows-amd64.msi

      - name: Rename macOS artifacts
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [[ "${{ matrix.args }}" == *"aarch64"* ]]; then
            cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz pubky-backup-${{ steps.version.outputs.version }}-macos-arm64.app.tar.gz
          else
            cp src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz pubky-backup-${{ steps.version.outputs.version }}-macos-amd64.app.tar.gz
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.args != '' && matrix.args || 'default' }}
          path: pubky-backup-*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          excludeTypes: ""
          useGitmojis: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/**/pubky-backup-*
          body: ${{ steps.changelog.outputs.changes }}
          # Tags like v0.6.0-rc.1 are pre-releases, never shown as the latest
          prerelease: ${{ contains(github.ref_name, '-') }}