name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build:
    name: "Build Release Bundles"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
        # Setup the environment
      - uses: actions/checkout@v4      
      - name: Setup Environment
        uses: ./.github/setup
        with:
          rust-version: stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.8.4" --locked
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node.js dependencies
        run: npm ci

      - name: Extract version info from tauri.conf.json
        id: tauri-info
        run: |
          PRODUCT_NAME=$(jq -r '.productName' src-tauri/tauri.conf.json)
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "PRODUCT_NAME=${PRODUCT_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${PRODUCT_NAME}-v${VERSION}-linux-amd64" >> $GITHUB_ENV

      # Build and zip
      - name: Build Tauri App
        run: cargo tauri build
      - name: Gzip artifacts
        run: |
          cd src-tauri/target/release/
          tar -czf "${ARTIFACT_NAME}.tar.gz" "$PRODUCT_NAME"

      # If tag then create release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.ref_type == 'tag'
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.PRODUCT_NAME }} v${{ env.VERSION }}
          files: src-tauri/target/release/${{ env.ARTIFACT_NAME }}.tar.gz
          generate_release_notes: true

