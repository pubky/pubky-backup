<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tauri + React App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Startup Screen -->
    <div id="startup-screen" class="screen">
      <main class="container">
        <h1>Pubky Backup</h1>
        <p>Insert your pubky:</p>
        <input
          id="pubky-input"
          type="text"
          placeholder="Enter your pubky..."
          class="pubky-input"
        />
        <button id="continue-btn" class="primary-btn">Continue to App</button>
      </main>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen hidden">
      <main class="container">
        <h1>Welcome to Tauri + React</h1>

        <form class="row" id="greet-form">
          <input
            id="greet-input"
            placeholder="Enter a name..."
          />
          <button type="submit">Greet</button>
        </form>
        <form class="row" id="fetch-form">
          <button type="submit">Fetch</button>
        </form>
        <form class="row" id="fetch-state-form">
          <button type="submit">Fetch from state</button>
        </form>
        <p id="greet-msg"></p>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
