<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tauri + React App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Startup Screen -->
    <div id="startup-screen" class="screen">
      <main class="container">
        <div class="header-box box">
          <div id="startup-dev-indicator" class="dev-indicator hidden">
            <span>🔧 Developer Mode</span>
          </div>
        </div>
        <div id="startup-form" class="form-box box">
          <p>Enter your Pubky private key (hexadecimal):</p>
          <input
            id="private-key-input"
            type="password"
            placeholder="e.g. 0f1a..."
            autocomplete="off"
          />
          <div>
            <!-- Add spinner to both sides to centre label - Sorry.-->
            <button id="continue-btn" class="button-container standard-btn"><span class="spinner" style="visibility: hidden;">◐</span>Continue<span id="continue-spinner" class="spinner hidden">◐</span></button>
          </div>
        </div>
      </main>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen hidden">
      <main class="container">
        <div class="header-box box">
          <button id="back-btn" class="back-btn">Back</button>
          <div id="dev-indicator" class="dev-indicator hidden">
            <span>🔧 Developer Mode</span>
          </div>
        </div>
        <div id="main-form" class="form-box box hidden">
          <h2>Your Pubky: <span id="pubky-display"></span> <button id="copy-pubky" class="copy-btn" title="Copy full pubky">📋</button></h2>
          <h2>Homeserver: <span id="homeserver-display"></span> <button id="copy-homeserver" class="copy-btn" title="Copy full homeserver">📋</button></h2>
          <div id="sync-status" class="sync-status">
            <span id="status-text">Synced</span>
            <span id="status-spinner" class="spinner hidden">◐</span>
            <span id="status-tick" class="tick hidden">✓</span>
          </div>
          <div id="backup-size" class="backup-size">Current folder size: <span id="backup-size-value">--</span></div>
          <div id="data-dir-display" class="data-dir-display">
            Data dir: <span id="data-dir-value">--</span>
            <button id="open-data-dir" class="icon-btn" title="Open data directory">📁</button>
          </div>
          <div id="button-container" class="button-container">
            <div id="countdown-display" class="countdown">Next sync in: <span id="countdown-timer">--</span></div>
            <button id="force-sync-btn" class="standard-btn">Upload now</button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
